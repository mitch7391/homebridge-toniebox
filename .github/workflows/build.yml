name: Validate

on: [push, pull_request]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Build and run offline tests
        run: npm test
      - name: Verify validation did not change tracked files
        run: git diff --exit-code

  minimum-runtime:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.10.0, 24.0.0]
    steps:
      - uses: actions/checkout@v5
      - name: Use the development toolchain
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Use the minimum supported runtime
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - name: Test compiled output without running development tools
        run: node --test
      - name: Verify validation did not change tracked files
        run: git diff --exit-code
